<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="早雲楓人のポートフォリオ。AI、ソフトウェア、フィジカルシステムの制作記録。" />
    <title>早雲楓人 — Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const storageKey = 'portfolio-spa-path'
        let savedPath = null
        try {
          savedPath = sessionStorage.getItem(storageKey)
          sessionStorage.removeItem(storageKey)
        } catch {
          return
        }
        if (!savedPath) return
        if (savedPath.startsWith('/')) history.replaceState(null, '', savedPath)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
